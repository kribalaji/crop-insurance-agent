[project]
name = "crop-insurance-agent"
version = "0.1.0"
description = "Multi-agent crop insurance claims system built on public data"
readme = "README.md"
authors = [
    { name = "Balaji Krishnamoorthy", email = "kribalaji@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imdlib>=0.3.1",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.6.11",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.15",
    "netcdf4>=1.7.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "xarray>=2026.9.0",
]

[project.scripts]
crop-insurance-agent = "crop_insurance_agent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:datetime.datetime.utcnow:DeprecationWarning:imdlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
